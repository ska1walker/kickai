# Zweiter täglicher News-Sammellauf (abends) — ergänzt den Vercel-Cron (06:00).
# Morgens + abends sammeln = doppelte Abdeckung des Nachrichtentags; der
# dedup_key in news_log verhindert Dubletten. Läuft über GitHub Actions, weil
# der Vercel-Hobby-Plan nur tägliche Crons erlaubt (beide Slots sind belegt).
name: collect-news-evening

on:
  schedule:
    - cron: "0 17 * * *" # täglich 17:00 UTC (≈ 18/19 Uhr DE)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: News-Sammler anstoßen
        run: |
          resp=$(curl -s --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://kickai-one.vercel.app/api/collect-news")
          echo "Antwort: $resp"
          echo "$resp" | grep -q '"inserted"' || exit 1
